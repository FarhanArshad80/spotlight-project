<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Signup Page</title>
    <style>
        /* Internal CSS */
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 20px 0;
        }

        .signup-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #444;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="password"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        /* Gender Radio Styling */
        .gender-group {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }
        .gender-option {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: normal;
        }

        .error-message {
            color: #d9534f;
            font-size: 0.8rem;
            margin-top: 4px;
            display: block;
            height: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="signup-card">
    <h2>Create Account</h2>
    <form id="registrationForm">
        
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="userName" placeholder="Enter full name">
            <span id="nameError" class="error-message"></span>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="text" id="userEmail" placeholder="email@example.com">
            <span id="emailError" class="error-message"></span>
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="userPhone" placeholder="1234567890">
            <span id="phoneError" class="error-message"></span>
        </div>

        <div class="form-group">
            <label>Gender</label>
            <div class="gender-group">
                <label class="gender-option"><input type="radio" name="gender" value="male"> Male</label>
                <label class="gender-option"><input type="radio" name="gender" value="female"> Female</label>
                <label class="gender-option"><input type="radio" name="gender" value="other"> Other</label>
            </div>
            <span id="genderError" class="error-message"></span>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="userPass" placeholder="Min. 8 characters">
            <span id="passError" class="error-message"></span>
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="confirmPass" placeholder="Re-enter password">
            <span id="confirmError" class="error-message"></span>
        </div>

        <button type="submit">Register Now</button>
    </form>
</div>

<script>
    document.getElementById('registrationForm').addEventListener('submit', function(e) {
        e.preventDefault();

        // Values
        const name = document.getElementById('userName').value.trim();
        const email = document.getElementById('userEmail').value.trim();
        const phone = document.getElementById('userPhone').value.trim();
        const gender = document.querySelector('input[name="gender"]:checked');
        const pass = document.getElementById('userPass').value;
        const confirmPass = document.getElementById('confirmPass').value;

        // Error Spans
        const errors = {
            name: document.getElementById('nameError'),
            email: document.getElementById('emailError'),
            phone: document.getElementById('phoneError'),
            gender: document.getElementById('genderError'),
            pass: document.getElementById('passError'),
            confirm: document.getElementById('confirmError')
        };

        // Reset Errors
        Object.values(errors).forEach(span => span.textContent = "");

        let isValid = true;

        // Name Validation
        if (name.length < 3) {
            errors.name.textContent = "Name must be at least 3 characters.";
            isValid = false;
        }

        // Email Validation
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            errors.email.textContent = "Please enter a valid email address.";
            isValid = false;
        }

        // Phone Validation (basic 10-digit check)
        if (phone.length < 10 || isNaN(phone)) {
            errors.phone.textContent = "Enter a valid 10-digit phone number.";
            isValid = false;
        }

        // Gender Validation
        if (!gender) {
            errors.gender.textContent = "Please select your gender.";
            isValid = false;
        }

        // Password Validation
        if (pass.length < 8) {
            errors.pass.textContent = "Password must be at least 8 characters.";
            isValid = false;
        }

        // Confirm Password Validation
        if (confirmPass !== pass) {
            errors.confirm.textContent = "Passwords do not match!";
            isValid = false;
        } else if (confirmPass === "") {
            errors.confirm.textContent = "Please confirm your password.";
            isValid = false;
        }

        if (isValid) {
            alert("Registration successful!");
        }
    });
</script>

</body>
</html>
